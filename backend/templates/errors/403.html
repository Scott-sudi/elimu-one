{% extends "layouts/auth.html" %}
{% load static %}

{% block title %}Accès refusé{% endblock %}

{% block auth_content %}
  <div class="card" style="max-width: 420px; margin: 0 auto; text-align: center; padding: 2rem;">
    <div class="sidebar__logo" style="margin: 0 auto 1rem; width: 48px; height: 48px;">
      <i data-lucide="shield-off" width="24" height="24"></i>
    </div>
    <p style="font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: #a2aea8; margin-bottom: 0.5rem;">Erreur 403</p>
    <h1 style="font-size: 1.35rem; margin: 0 0 0.5rem;">Accès refusé</h1>
    <p style="color: #a2aea8; font-size: 0.875rem; margin: 0 0 1.5rem;">
      Vous n'avez pas l'autorisation d'accéder à cette ressource sur {{ platform_name }}.
    </p>
    <a href="{% url 'dashboard:home' %}" class="btn btn--primary">Retour au tableau de bord</a>
  </div>
{% endblock %}
