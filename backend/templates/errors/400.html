{% extends "layouts/auth.html" %}
{% load static %}

{% block title %}Requête incorrecte{% endblock %}

{% block auth_content %}
  <div class="card" style="max-width: 420px; margin: 0 auto; text-align: center; padding: 2rem;">
    <div class="sidebar__logo" style="margin: 0 auto 1rem; width: 48px; height: 48px;">
      <i data-lucide="school" width="24" height="24"></i>
    </div>
    <p style="font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: #a2aea8; margin-bottom: 0.5rem;">Erreur 400</p>
    <h1 style="font-size: 1.35rem; margin: 0 0 0.5rem;">Requête incorrecte</h1>
    <p style="color: #a2aea8; font-size: 0.875rem; margin: 0 0 1.5rem;">
      La requête envoyée à {{ school_name|default:"Kalunga" }} n'a pas pu être traitée.
    </p>
    <a href="{% url 'dashboard:home' %}" class="btn btn--primary">Retour à l'accueil</a>
  </div>
{% endblock %}
