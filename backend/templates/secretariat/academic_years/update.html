{% extends "layouts/app.html" %}
{% block title %}Modifier {{ year.label }}{% endblock %}
{% block content %}
<div data-page="secretariat-academic-years">
  <div class="content__header">
    <div>
      <h2 class="content__title">Modifier l'année scolaire</h2>
      <p class="content__description">{{ year.label }}</p>
    </div>
  </div>
  <section class="card">
    <div class="card__body">
      <form method="post">
        {% csrf_token %}
        {% include "secretariat/_form_fields.html" with form=form %}
        <div class="form-actions">
          <a class="btn btn--secondary" href="{% url 'secretariat:academic-years' %}">Annuler</a>
          <button class="btn btn--primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </section>
</div>
{% endblock %}
