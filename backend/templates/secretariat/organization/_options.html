<div class="table-wrap"><table class="table table--dense"><thead><tr><th>Nom</th><th>Code</th><th>Section</th><th>Statut</th></tr></thead><tbody>{% for item in options %}<tr><td>{{ item.name }}</td><td>{{ item.code }}</td><td>{{ item.section|default:"—" }}</td><td><span class="badge {% if item.is_active %}badge--success{% endif %}">{{ item.is_active|yesno:"Active,Inactive" }}</span></td></tr>{% empty %}<tr><td colspan="4" class="table__empty">Aucune option</td></tr>{% endfor %}</tbody></table></div>
