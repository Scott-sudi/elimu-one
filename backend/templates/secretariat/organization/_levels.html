<div class="table-wrap"><table class="table table--dense"><thead><tr><th>Ordre</th><th>Nom</th><th>Code</th><th>Statut</th></tr></thead><tbody>{% for item in levels %}<tr><td>{{ item.order }}</td><td>{{ item.name }}</td><td>{{ item.code|default:"—" }}</td><td><span class="badge {% if item.is_active %}badge--success{% endif %}">{{ item.is_active|yesno:"Actif,Inactif" }}</span></td></tr>{% empty %}<tr><td colspan="4" class="table__empty">Aucun niveau</td></tr>{% endfor %}</tbody></table></div>
