{% extends "layouts/app.html" %}{% block title %}Élèves{% endblock %}{% block content %}
<div data-page="secretariat-students"><div class="content__header"><div><h2 class="content__title">Élèves</h2><p class="content__description">Dossiers et parcours scolaires</p></div><div class="content__actions"><a class="btn btn--secondary" href="{% url 'secretariat:students-export' 'csv' %}?{{ request.GET.urlencode }}">Exporter CSV</a><a class="btn btn--primary" href="{% url 'secretariat:student-create' %}">Nouvel élève</a></div></div>
<form class="secretariat-toolbar" method="get" hx-get="{% url 'secretariat:students' %}" hx-target="#students-table" hx-push-url="true" hx-trigger="submit, keyup changed delay:400ms from:input"><input type="search" class="form-input form-input--sm" name="q" value="{{ request.GET.q }}" placeholder="Matricule ou nom"><select class="form-select" name="status"><option value="">Tous les statuts</option><option value="ACTIF">Actifs</option><option value="ARCHIVE">Archivés</option></select><button class="btn btn--secondary btn--sm">Filtrer</button></form>{% include "secretariat/students/_table.html" %}</div>{% endblock %}
