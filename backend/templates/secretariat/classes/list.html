{% extends "layouts/app.html" %}{% block title %}Classes{% endblock %}{% block content %}
<div data-page="secretariat-classes"><div class="content__header"><div><h2 class="content__title">Classes</h2><p class="content__description">Capacités et effectifs</p></div><button class="btn btn--primary" data-modal-open="class-modal">Nouvelle classe</button></div>
<form class="secretariat-toolbar" method="get" hx-get="{% url 'secretariat:classes' %}" hx-target="#classes-table" hx-push-url="true"><input class="form-input form-input--sm" name="q" value="{{ request.GET.q }}" placeholder="Nom ou code"><button class="btn btn--secondary btn--sm">Rechercher</button></form>{% include "secretariat/classes/_table.html" %}</div>{% endblock %}
{% block modals %}<div class="modal-backdrop" id="class-modal" data-modal="class-modal" hidden><div class="modal modal--lg" data-modal-panel><div class="modal__header"><h2>Nouvelle classe</h2><button class="modal__close" data-modal-close>×</button></div><div class="modal__body">{% include "secretariat/classes/_form.html" %}</div></div></div>{% endblock %}
