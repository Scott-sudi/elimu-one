{% extends "layouts/app.html" %}
{% block title %}Modifier {{ school_class.name }}{% endblock %}
{% block content %}
<div data-page="secretariat-classes">
  <div class="content__header">
    <div>
      <h2 class="content__title">Modifier la classe</h2>
      <p class="content__description">{{ school_class.name }} · {{ school_class.academic_year }}</p>
    </div>
  </div>
  <section class="card">
    <div class="card__body">
      <form method="post">
        {% csrf_token %}
        {% include "secretariat/_form_fields.html" with form=form %}
        <div class="form-actions">
          <a class="btn btn--secondary" href="{% url 'secretariat:class-detail' school_class.public_id %}">Annuler</a>
          <button class="btn btn--primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </section>
</div>
{% endblock %}
