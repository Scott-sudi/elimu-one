{% extends "layouts/app.html" %}
{% block title %}Nouvelle communication{% endblock %}
{% block content %}
<div data-page="secretariat-communications" data-students-url="{% url 'secretariat:communication-class-students' %}">
  <div class="content__header">
    <div>
      <h2 class="content__title">Nouvelle communication</h2>
    </div>
  </div>
  <div class="secretariat-form-narrow">
    <section class="card">
      <div class="card__body">
        <form method="post" enctype="multipart/form-data" data-communication-audience>
          {% csrf_token %}
          {% include "secretariat/_form_fields.html" with form=form %}
          <div class="content__actions">
            <a class="btn btn--secondary" href="{% url 'secretariat:communications' %}">Annuler</a>
            <button class="btn btn--primary" type="submit">Créer le brouillon</button>
          </div>
        </form>
      </div>
    </section>
  </div>
</div>
{% endblock %}
