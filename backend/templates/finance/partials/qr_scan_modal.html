<div
  class="modal-backdrop"
  id="finance-qr-scan-modal"
  data-modal="finance-qr-scan-modal"
  data-finance-qr-scan-modal
  data-resolve-url="{% url 'finance:card-scan-resolve' %}"
  hidden
>
  <div class="modal modal--form-narrow" data-modal-panel role="dialog" aria-modal="true" aria-labelledby="finance-qr-scan-title">
    <div class="modal__header">
      <h3 id="finance-qr-scan-title">Scanner la carte élève</h3>
      <button type="button" class="modal__close" data-modal-close aria-label="Fermer">
        <i data-lucide="x" width="18" height="18"></i>
      </button>
    </div>
    <div class="modal__body">
      <p class="finance-qr-scan__hint">
        Placez le QR code de la carte devant la caméra. Vous serez redirigé vers la situation comptable de l’élève.
      </p>
      <div id="finance-qr-reader" class="finance-qr-scan__reader" data-finance-qr-reader></div>
      <p class="finance-qr-scan__status" data-finance-qr-status role="status" aria-live="polite"></p>
      <div class="form-group" style="margin-top:0.75rem;">
        <label class="form-label" for="finance-qr-manual">Ou coller l’identifiant QR</label>
        <div class="finance-qr-scan__manual">
          <input
            class="form-input"
            id="finance-qr-manual"
            type="text"
            name="qr_manual"
            placeholder="KAL-CARD-…"
            autocomplete="off"
            data-finance-qr-manual
          >
          <button type="button" class="btn btn--primary btn--sm" data-finance-qr-manual-submit>
            Ouvrir
          </button>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" data-modal-close>Fermer</button>
    </div>
  </div>
</div>
