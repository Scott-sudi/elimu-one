{% extends "layouts/app.html" %}
{% block title %}Reçus{% endblock %}
{% block content %}
<div data-page="finance-receipts">
  <div class="content__header">
    <div>
      <h2 class="content__title">Reçus</h2>
      <p class="content__description">
        {% if selected_academic_year %}Année {{ selected_academic_year.label }} · {% endif %}
        Consultez, imprimez ou téléchargez les reçus émis.
      </p>
    </div>
  </div>
  <form
    class="secretariat-toolbar"
    method="get"
    hx-get="{% url 'finance:receipts' %}"
    hx-target="#receipts-table"
    hx-push-url="true"
  >
    <input
      class="form-input form-input--sm"
      type="search"
      name="q"
      value="{{ current_filters.q }}"
      placeholder="N° reçu, matricule ou nom"
    >
    <button class="btn btn--secondary btn--sm" type="submit">Rechercher</button>
  </form>
  {% include "finance/receipts/_table.html" %}
</div>
{% endblock %}
