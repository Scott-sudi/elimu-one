{# Conteneur de notifications (complète #toast-root de base.html) #}
<div
  id="{{ notification_id|default:'kalunga-toasts' }}"
  class="kalunga-toast-container alert-toast"
  role="region"
  aria-live="polite"
  aria-relevant="additions"
  aria-label="Notifications"
></div>

{% if messages %}
  <div class="alert-stack" style="margin-bottom: 1rem;">
    {% for message in messages %}
      <div class="alert alert--{% if 'error' in message.tags %}danger{% elif 'success' in message.tags %}success{% elif 'warning' in message.tags %}warning{% else %}info{% endif %}" role="status">
        <span class="alert__icon">
          {% if 'error' in message.tags %}
            <i data-lucide="circle-alert" width="18" height="18"></i>
          {% elif 'success' in message.tags %}
            <i data-lucide="circle-check" width="18" height="18"></i>
          {% elif 'warning' in message.tags %}
            <i data-lucide="triangle-alert" width="18" height="18"></i>
          {% else %}
            <i data-lucide="info" width="18" height="18"></i>
          {% endif %}
        </span>
        <div class="alert__content">
          <div class="alert__message">{{ message }}</div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endif %}
