{# Shell modal — id / title via include context #}
<div
  class="modal-backdrop"
  id="{{ modal_id|default:'app-modal' }}"
  data-modal="{{ modal_id|default:'app-modal' }}"
  hidden
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-labelledby="{{ modal_id|default:'app-modal' }}-title"
>
  <div class="modal modal--{{ modal_size|default:'md' }}" data-modal-panel tabindex="-1">
    <div class="modal__header">
      <h2 class="modal__title" id="{{ modal_id|default:'app-modal' }}-title" {% if title_attr %}{{ title_attr }}{% endif %}>
        {{ modal_title|default:"Dialogue" }}
      </h2>
      <button type="button" class="modal__close" data-modal-close aria-label="Fermer">
        <i data-lucide="x" width="18" height="18"></i>
      </button>
    </div>
    <div class="modal__body" {% if body_attr %}{{ body_attr }}{% endif %}>
      {% block modal_body %}{% endblock %}
      {{ modal_body|default:"" }}
    </div>
    {% if show_footer|default:True %}
      <div class="modal__footer">
        {% block modal_footer %}
          <button type="button" class="btn btn--secondary" data-modal-close>Annuler</button>
          <button type="submit" class="btn btn--primary" form="{{ form_id|default:'' }}">
            {{ confirm_label|default:"Enregistrer" }}
          </button>
        {% endblock %}
      </div>
    {% endif %}
  </div>
  <div data-modal-backdrop style="position: absolute; inset: 0; z-index: -1;"></div>
</div>
