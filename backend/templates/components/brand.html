{% load static %}
{# Logo officiel si présent, sinon icône scolaire Lucide provisoire #}
<div class="brand {% if compact %}brand--compact{% endif %}" data-brand>
  <a href="{% url 'dashboard:home' %}" class="brand__link" title="{{ school_full_name|default:'Kalunga – La Source du Savoir' }}">
    <span class="brand__mark">
      <img
        src="{% static 'images/branding/logo.png' %}"
        alt="{{ school_name|default:'Kalunga' }}"
        class="brand__logo"
        width="32"
        height="32"
        hidden
        onload="this.hidden = false; const f = this.nextElementSibling; if (f) f.hidden = true;"
        onerror="this.remove();"
      >
      <span class="brand__fallback sidebar__logo" aria-hidden="true">
        <i data-lucide="school" width="18" height="18"></i>
      </span>
    </span>
    {% if not icon_only %}
      <span class="brand__text sidebar__brand-text">
        <span class="brand__name">{{ school_name|default:"Kalunga" }}</span>
        {% if not compact %}
          <span class="brand__slogan">{{ school_slogan|default:"La Source du Savoir" }}</span>
        {% endif %}
      </span>
    {% endif %}
  </a>
</div>

<style>
  .brand__link { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
  .brand__mark { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
  .brand__logo { width: 32px; height: 32px; object-fit: contain; border-radius: 4px; display: block; }
  .brand__fallback { width: 32px; height: 32px; }
  .brand__text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .brand__name { font-weight: 600; font-size: 0.95rem; color: #f4f7f5; white-space: nowrap; }
  .brand__slogan { font-size: 0.7rem; color: #a2aea8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-shell--collapsed .brand__text { display: none; }
</style>
